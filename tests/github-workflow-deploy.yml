# Deploy automático del backend a Google Apps Script.
#
# Copiar UNA sola vez a .github/workflows/deploy-backend.yml
# (GitHub → Add file → Create new file), porque el token automático de este repo
# no puede crear archivos en .github/workflows/.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON               contenido de ~/.clasprc.json tras `clasp login`
#                              (el workflow tolera texto extra, p. ej. el prompt de la shell)
#   APPS_SCRIPT_ID             ID del proyecto (Apps Script → Configuración del proyecto)
#   APPS_SCRIPT_DEPLOYMENT_ID  ID de la implementación (el AKfycb… de la URL /exec)
#
# Requisitos:
#   - Habilitar la Apps Script API: https://script.google.com/home/usersettings
#   - `clasp login` con la MISMA cuenta dueña del script.
#   - La implementación ya debe existir: este workflow la actualiza (misma URL).

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar clasp
        run: |
          npm install -g @google/clasp@3
          clasp --version

      - name: Credenciales de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          raw = os.environ.get('CLASPRC_JSON', '').replace('\ufeff', '')
          if not raw.strip():
              print('::error::Falta el secreto CLASPRC_JSON')
              sys.exit(1)

          attempts = [('tal cual', raw.strip()), ('sin saltos', re.sub(r'[\r\n\t]', '', raw).strip())]
          start, end = raw.find('{'), raw.rfind('}')
          if start > -1 and end > start:
              cut = raw[start:end + 1]
              attempts.append(('recortado', cut))
              attempts.append(('recortado y sin saltos', re.sub(r'[\r\n\t]', '', cut)))

          data = None
          errors = []
          for label, candidate in attempts:
              try:
                  parsed, idx = json.JSONDecoder().raw_decode(candidate)
              except Exception as exc:
                  errors.append(label + ': ' + str(exc))
                  continue
              if isinstance(parsed, dict) and 'tokens' in parsed:
                  data = parsed
                  print('Credenciales: OK (' + label + ')')
                  if label != 'tal cual':
                      print('::warning::Se normalizo CLASPRC_JSON (' + label + '). Conviene re-copiarlo en una sola linea.')
                  leftover = candidate[idx:].strip()
                  if leftover:
                      print('::warning::Se ignoro texto extra despues del JSON: ' + leftover[:60])
                  break

          if data is None:
              print('::error::CLASPRC_JSON no es JSON valido')
              for err in errors:
                  print('  - ' + err)
              sys.exit(1)

          path = os.path.expanduser('~/.clasprc.json')
          with open(path, 'w', encoding='utf-8') as fh:
              fh.write(json.dumps(data))
          os.chmod(path, 0o600)
          print('Escrito ' + path)
          PY

      - name: Configurar el proyecto
        working-directory: backend
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          SCRIPT_ID="$(printf '%s' "$APPS_SCRIPT_ID" | tr -d '[:space:]')"
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::Falta el secreto APPS_SCRIPT_ID"
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":".","filePushOrder":["Code.js","appsscript.json"]}\n' "$SCRIPT_ID" > .clasp.json
          echo "Proyecto configurado: $SCRIPT_ID"

      - name: Subir el código
        working-directory: backend
        run: clasp push -f

      - name: Publicar versión nueva (misma URL)
        working-directory: backend
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          DEPLOY_ID="$(printf '%s' "$APPS_SCRIPT_DEPLOYMENT_ID" | tr -d '[:space:]')"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Falta el secreto APPS_SCRIPT_DEPLOYMENT_ID"
            exit 1
          fi
          clasp deploy --deploymentId "$DEPLOY_ID" --description "CI $GITHUB_SHA"
